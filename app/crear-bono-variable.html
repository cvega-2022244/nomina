    <style>
        .role-restricted {
            display: none !important;
        }
        .menu-item-restricted {
            display: none !important;
        }
        

        
        /* Lista de empleados con checkboxes */
        #lista_empleados {
            max-height: 280px;
            overflow-y: auto;
            background: var(--dash-card-bg);
            border: 1px solid var(--dash-border);
            border-radius: 6px;
            padding: 8px;
        }
        #lista_empleados::-webkit-scrollbar {
            width: 6px;
        }
        #lista_empleados::-webkit-scrollbar-track {
            background: var(--dash-card-bg);
        }
        #lista_empleados::-webkit-scrollbar-thumb {
            background: #4361ee;
            border-radius: 3px;
        }
        
        .empleado-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            background: var(--dash-card-bg);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--dash-border);
        }
        .empleado-item:hover {
            background: var(--dash-shadow-hover);
            border-color: #4361ee;
        }
        .empleado-item.selected {
            background: rgba(67, 97, 238, 0.15);
            border-color: #4361ee;
        }
        .empleado-item input[type="checkbox"],
        .empleado-item input[type="radio"] {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            margin: 0;
            margin-right: 12px;
            accent-color: #4361ee;
            cursor: pointer;
        }
        .empleado-item label {
            margin: 0;
            cursor: pointer;
            color: var(--dash-text);
            font-size: 14px;
            flex: 1;
            line-height: 1.4;
        }
        
        /* Buscador de empleados */
        #buscar_empleado {
            background: var(--dash-card-bg);
            border: 1px solid var(--dash-border);
            color: var(--dash-text);
        }
        #buscar_empleado:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }
        #buscar_empleado::placeholder {
            color: #888ea8;
        }
        
        /* Contador de empleados */
        .empleados-contador {
            font-size: 13px;
            color: #888ea8;
            margin-top: 8px;
        }
        .empleados-contador strong {
            color: #4361ee;
        }
        
        /* Checkbox autorizado cenas */
        .autorizado-cenas-wrapper {
            background: var(--dash-card-bg);
            border: 1px solid var(--dash-border);
            border-radius: 6px;
            padding: 12px 16px;
            margin-top: 10px;
        }
        .autorizado-cenas-wrapper .form-check-input {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            accent-color: #00ab55;
        }
        .autorizado-cenas-wrapper label {
            color: var(--dash-text);
            font-size: 14px;
        }
    </style>

    <script>
        // Verificar permisos para esta página - Todos pueden crear bonos
        $(document).ready(function() {
            // No hay restricciones - todos los usuarios pueden acceder
            
            // Si hay hash #comisiones, hacer scroll a esa sección
            if (window.location.hash === '#comisiones') {
                setTimeout(function() {
                    document.getElementById('comisiones').scrollIntoView({ 
                        behavior: 'smooth',
                        block: 'start'
                    });
                }, 500);
            }
        });
    </script>

    <script>
        // Función para cerrar sesión
        function cerrarSesion() {
            Swal.fire({
                icon: 'question',
                title: '¿Cerrar sesión?',
                text: '¿Estás seguro de que deseas cerrar sesión?',
                showCancelButton: true,
                confirmButtonText: 'Sí, cerrar sesión',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#dc3545'
            }).then((result) => {
                if (result.isConfirmed) {
                    sessionStorage.clear();
                    window.location.href = 'login.html';
                }
            });
        }
        
        // Protección de página según rol
        $(document).ready(function() {
            // Mostrar nombre de usuario en navbar
            const userData = JSON.parse(sessionStorage.getItem('usuario_principal'));
            if (userData && userData.nombre) {
                $('#usuario_nombre_header').text('Hola, ' + userData.nombre);
            }
            
            const userRole = sessionStorage.getItem('rol') || '';
            
            // Admin tiene acceso completo
            if (userRole === 'admin') {
                $('.role-restricted').removeClass('role-restricted');
            }
            
            // Operaciones: ocultar items del menú que no le corresponden
            if (userRole === 'operaciones') {
                $('.menu-bonos').hide();
                $('.menu-horas-extra').hide();
                $('.menu-item-dias_laborados').hide();
                $('.menu-item-descuentos').hide();
                $('.menu-item-isr').hide();
                // Ocultar el enlace "Menú" del header para operaciones
                $('a.nav-link[href="./index.html"]').hide();
            }
            
            console.log('✅ Acceso - ' + userRole);
        });
    </script>
