<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <title>Nómina | Iniciar Sesión</title>

    <link rel="icon" type="image/x-icon" href="../src/assets/img/favicon.ico" />
    <link href="../layouts/vertical-dark-menu/css/light/loader.css" rel="stylesheet" type="text/css" />
    <link href="../layouts/vertical-dark-menu/css/dark/loader.css" rel="stylesheet" type="text/css" />
    <script src="../layouts/vertical-dark-menu/loader.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="../src/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="../src/plugins/src/sweetalerts2/sweetalerts2.css">
    <link href="../src/plugins/css/light/sweetalerts2/custom-sweetalert.css" rel="stylesheet" type="text/css" />
    <link href="../src/plugins/css/dark/sweetalerts2/custom-sweetalert.css" rel="stylesheet" type="text/css" />
    <link href="css/login.css" rel="stylesheet" type="text/css" />


</head>

<body>

    <div id="load_screen">
        <div class="loader">
            <div class="loader-content">
                <div class="spinner-grow align-self-center"></div>
            </div>
        </div>
    </div>
    <div class="auth-wrapper">
        <div class="saas-card">

            <div class="brand-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M11.996 2.042c-2.316.59-4.884 1.135-7.796 1.636-.78.134-1.2.983-1.2 1.776v6.52c0 6.643 4.607 10.155 8.653 11.966.216.096.47.096.686 0 4.046-1.81 8.653-5.323 8.653-11.966v-6.52c0-.793-.42-1.642-1.2-1.776-2.912-.501-5.48-1.046-7.796-1.636z"
                        fill-rule="nonzero" />
                </svg>
            </div>

            <div class="saas-header">
                <h2>Plataforma Nómina</h2>
                <p>Sistema para administrar la nómina de los colaboradores de forma rápida y segura.</p>
            </div>

            <div class="saas-form">
                <div class="form-group">
                    <label class="saas-label" for="user_name">Usuario</label>
                    <input class="saas-input" id="user_name" type="text" placeholder="Ingresa tu usuario" required
                        autocomplete="username" />
                </div>

                <div class="form-group">
                    <label class="saas-label" for="password">Contraseña</label>
                    <input class="saas-input" id="password" type="password" placeholder="••••••••" required
                        autocomplete="current-password" />
                </div>

                <button class="saas-btn" onclick="login()">Iniciar Sesión</button>
            </div>

        </div>
    </div>

    <script src="../src/plugins/src/sweetalerts2/sweetalerts2.min.js"></script>
    <script src="../src/plugins/src/sweetalerts2/custom-sweetalert-safe.js"></script>

    <script src="./js/jquery.js" crossorigin="anonymous"></script>
    <script src="../src/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/clear-storage.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
