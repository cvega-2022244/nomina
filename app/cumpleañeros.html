<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleañeros</title>
    <!-- AJAX -->
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --text-dark: #2D3436;
            --text-light: #F9F9F9;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
        }

        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" opacity="0.4"><circle cx="10" cy="10" r="2" fill="%23FF6B6B"/><rect x="30" y="20" width="4" height="4" fill="%234ECDC4" transform="rotate(45 32 22)"/><circle cx="70" cy="15" r="3" fill="%23FFE66D"/><rect x="80" y="40" width="3" height="6" fill="%23FF6B6B" transform="rotate(20 81 43)"/><circle cx="20" cy="60" r="2" fill="%234ECDC4"/><circle cx="50" cy="80" r="2.5" fill="%23FFE66D"/><rect x="75" y="75" width="4" height="4" fill="%23FF6B6B" transform="rotate(-30 77 77)"/></svg>');
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 5px 15px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            width: 100%;
            z-index: 1;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes slideUp {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-content {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text-dark);
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .header-subtitle {
            color: #636e72;
            font-size: 1rem;
            font-weight: 300;
        }

        .table-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            background: white;
            margin-bottom: 30px;
            /* Added overflow-x to enable scrolling if table gets too wide */
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
            /* Ensure table has minimum width so it doesn't crush content */
        }

        th {
            background: linear-gradient(90deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            font-weight: 600;
            padding: 16px 20px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f2f6;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8faff;
            transform: scale(1.002);
        }

        .btn-export {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.5);
        }

        .btn-export:active {
            transform: translateY(1px);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .birthday-icon {
            font-size: 2.5rem;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }

            th,
            td {
                padding: 12px 10px;
                font-size: 0.85rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            .birthday-icon {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="confetti-container"></div>

    <div class="card">
        <div class="header-content">
            <h1>
                <span id="titulo_cumpleaneros">Lista de Cumpleañeros</span>
            </h1>
            <p class="header-subtitle">¡Celebra con tu equipo de trabajo en su día especial!</p>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre del Empleado</th>
                        <th>Área / Departamento</th>
                        <th>Día de Cumpleaños</th>
                        <th>Día de Descanso</th>
                    </tr>
                </thead>
                <tbody id="cuerpo_tabla">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
        </div>

        <div class="btn-container">
            <button class="btn-export" onclick="excel_cumpleaneros()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="8" y1="13" x2="16" y2="13"></line>
                    <line x1="8" y1="17" x2="16" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                Exportar a Excel
            </button>
        </div>
    </div>

    <!-- Ensure js is loaded properly -->
    <script src="./js/cumpleañeros.js"></script>
</body>

</html>
