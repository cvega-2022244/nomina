<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Salarios | Reporte Generado</title>
    
    <!-- Icono -->
    <link rel="icon" type="image/x-icon" href="../src/assets/img/favicon.ico" />
    
    <!-- Fuentes Modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos de Impresión y Pantalla -->
    <link rel="stylesheet" href="./css/style.css">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Estilos para visualización en pantalla */
        @media screen {
            body {
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            #cuerpo_documento {
                background: white;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
                border-radius: 8px;
                padding: 40px;
                width: 100%;
                max-width: 1400px;
                min-height: 100vh;
            }
            .print-notice {
                background: white;
                color: #333;
                padding: 10px 25px;
                border-radius: 12px;
                margin-bottom: 30px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                max-width: 1400px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                border: 1px solid #e0e0e0;
            }
            .notice-content {
                display: flex;
                align-items: center;
                gap: 15px;
                color: #0d47a1;
                font-weight: 500;
            }
            .user-section {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .btn-logout {
                display: flex;
                align-items: center;
                gap: 8px;
                background: white;
                color: #d32f2f;
                border: 1px solid #d32f2f;
                padding: 8px 16px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                text-decoration: none;
            }
            .btn-logout:hover {
                background: #fff5f5;
                transform: translateY(-1px);
                box-shadow: 0 4px 8px rgba(211, 47, 47, 0.1);
            }
            #usuario_nombre_reporte {
                font-size: 14px;
                font-weight: 600;
                color: #555;
            }
            .print-btn {
                background: #4361ee;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
                transition: all 0.2s;
                margin-left: 20px;
            }
            .print-btn:hover {
                background: #3046b1;
                transform: translateY(-1px);
            }
        }

        /* Ocultar elementos de UI al imprimir */
        @media print {
            .print-notice, .no-print {
                display: none !important;
            }
            body {
                background: white;
                padding: 0;
            }
            #cuerpo_documento {
                box-shadow: none;
                padding: 0;
                margin: 0;
            }
        }
    </style>

    <!-- AJAX LOCAL -->
    <script src="./js/jquery.js"></script>
</head>

<body>
    
    <div class="print-notice no-print">
        <div class="notice-content">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Reporte generado. Tamaño: <strong>Oficio (Legal)</strong> | Escala: <strong>55%</strong></span>
        </div>
        
        <div class="user-section">
            <span id="usuario_nombre_reporte">Cargando...</span>
            <button class="btn-logout" onclick="cerrarSesion()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Cerrar Sesión
            </button>
            <button class="print-btn" onclick="window.print()">Imprimir Reporte</button>
        </div>
    </div>

    <div id="cuerpo_documento">
        <!-- El contenido se inyecta vía salario.js -->
        <div class="loading-state" style="text-align: center; padding: 50px;">
            <div class="spinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #4361ee; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
            <p>Generando Libro de Salarios...</p>
        </div>
    </div>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script src="js/auth.js"></script>
    <script src="./js/salario.js"></script>
</body>

</html>
